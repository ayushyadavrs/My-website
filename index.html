<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wish Maker ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#0b0615;
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= CREATOR ================= */

.creator{
  min-height:100vh;
  padding:28px 15px 45px;
  background:
    radial-gradient(circle at 20% 0%,#5720a0 0%,transparent 35%),
    radial-gradient(circle at 90% 20%,#b51f70 0%,transparent 30%),
    linear-gradient(145deg,#10051f,#09030f);
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:7px;
}

.tagline{
  text-align:center;
  color:#ddd;
  opacity:.75;
  margin-bottom:28px;
}

.panel{
  padding:22px;
  border-radius:28px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.title{
  font-size:21px;
  font-weight:800;
  margin-bottom:16px;
}

.wishes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.wishChoice{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:18px;
  padding:16px 10px;
  transition:.2s;
}

.wishChoice:active{
  transform:scale(.96);
}

.wishChoice.active{
  background:linear-gradient(135deg,#ff3cac,#784bff);
  border-color:transparent;
  box-shadow:0 10px 30px rgba(164,60,255,.35);
}

.form{
  display:none;
  margin-top:24px;
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:700;
}

input,textarea{
  width:100%;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.22);
  color:white;
  outline:none;
  border-radius:15px;
  padding:14px;
}

input::placeholder,
textarea::placeholder{
  color:#aaa;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.generate{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:0;
  border-radius:16px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,#ff3cac,#784bff);
  box-shadow:0 10px 30px rgba(150,50,255,.35);
}

.credit{
  text-align:center;
  margin-top:22px;
  color:#aaa;
  font-size:13px;
}

/* ================= LINK BOX ================= */

.linkBox{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.12);
}

.linkInput{
  font-size:13px;
  margin-top:10px;
}

.linkButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.smallBtn{
  border:0;
  padding:13px;
  border-radius:13px;
  color:white;
  font-weight:800;
  background:rgba(255,255,255,.13);
}

.whatsapp{
  background:#20c063;
}

/* ================= RECEIVER ================= */

.receiver{
  display:none;
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
  position:relative;
  text-align:center;
}

.screen.active{
  display:flex;
}

.glass{
  width:min(560px,100%);
  padding:35px 23px;
  border-radius:32px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(20px);
  box-shadow:0 30px 100px rgba(0,0,0,.4);
}

.bigEmoji{
  font-size:82px;
  animation:float 2.3s ease-in-out infinite;
  margin-bottom:15px;
}

.screen h1{
  font-size:clamp(31px,8vw,55px);
  line-height:1.05;
  margin-bottom:15px;
}

.screen p{
  line-height:1.6;
  color:#eee;
  opacity:.8;
}

.openBtn{
  margin-top:25px;
  padding:16px 30px;
  border:0;
  border-radius:999px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,#ff3cac,#784bff);
  box-shadow:0 10px 35px rgba(180,50,255,.4);
}

.gift{
  font-size:125px;
  animation:gift 1.7s ease-in-out infinite;
  margin-bottom:10px;
}

.finalCard{
  width:min(680px,100%);
  padding:30px 20px;
  border-radius:32px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(22px);
  box-shadow:0 30px 100px rgba(0,0,0,.4);
  position:relative;
  overflow:hidden;
}

.finalCard:before{
  content:"";
  position:absolute;
  width:250px;
  height:250px;
  background:rgba(255,255,255,.1);
  border-radius:50%;
  top:-130px;
  right:-100px;
}

.typeEmoji{
  font-size:70px;
  animation:float 2s ease-in-out infinite;
}

.finalTitle{
  position:relative;
  font-size:clamp(29px,7vw,48px);
  font-weight:900;
  line-height:1.08;
  margin-top:12px;
}

.finalMessage{
  position:relative;
  margin-top:18px;
  font-size:18px;
  line-height:1.75;
  white-space:pre-wrap;
}

.from{
  position:relative;
  margin-top:23px;
  font-size:18px;
  font-weight:800;
}

.special{
  position:relative;
  margin-top:23px;
  font-size:34px;
  letter-spacing:7px;
}

.actionBtn{
  margin-top:23px;
  padding:14px 24px;
  border:0;
  border-radius:999px;
  color:white;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  font-weight:900;
}

.restart{
  margin-left:7px;
  background:rgba(255,255,255,.13);
}

/* ================= BALLOONS ================= */

#balloonLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:50;
}

.balloon{
  position:absolute;
  bottom:-120px;
  width:62px;
  height:78px;
  border-radius:50% 50% 47% 47%;
  pointer-events:auto;
  cursor:pointer;
  box-shadow:
    inset 8px 8px 15px rgba(255,255,255,.25),
    inset -10px -12px 20px rgba(0,0,0,.16);
  animation:rise linear forwards;
}

.balloon:before{
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  border-left:6px solid transparent;
  border-right:6px solid transparent;
  border-top:10px solid currentColor;
}

.balloon:after{
  content:"";
  position:absolute;
  left:50%;
  top:78px;
  width:2px;
  height:100px;
  background:rgba(255,255,255,.4);
}

.balloon.pop{
  animation:pop .25s forwards!important;
}

@keyframes rise{
  to{
    transform:translateY(-120vh) rotate(15deg);
  }
}

@keyframes pop{
  0%{transform:scale(1);opacity:1}
  55%{transform:scale(1.35);opacity:.8}
  100%{transform:scale(0);opacity:0}
}

/* ================= EFFECTS ================= */

.confetti{
  position:fixed;
  top:-20px;
  width:8px;
  height:14px;
  z-index:100;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

.heart{
  position:fixed;
  bottom:-50px;
  z-index:40;
  font-size:25px;
  pointer-events:none;
  animation:heartRise 4s linear forwards;
}

@keyframes heartRise{
  to{
    transform:translateY(-115vh) rotate(30deg);
    opacity:0;
  }
}

.star{
  position:fixed;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  z-index:2;
  animation:twinkle 1.5s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.15;transform:scale(.6)}
  to{opacity:1;transform:scale(1.5)}
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

@keyframes gift{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-16px) rotate(2deg)}
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:500;
  left:50%;
  bottom:22px;
  transform:translate(-50%,100px);
  background:#17121e;
  border:1px solid rgba(255,255,255,.15);
  padding:13px 20px;
  border-radius:999px;
  transition:.3s;
}

.toast.show{
  transform:translate(-50%,0);
}

@media(max-width:550px){
  .wishes{
    grid-template-columns:1fr;
  }

  .linkButtons{
    grid-template-columns:1fr;
  }

  .restart{
    margin-left:0;
    margin-top:8px;
  }
}
</style>
</head>

<body>

<!-- ================= CREATOR ================= -->

<div id="creator" class="creator">

  <div class="wrap">

    <div class="logo">✨ Wish Maker</div>

    <div class="tagline">
      Create a special wish and share the surprise.
    </div>

    <div class="panel">

      <div class="title">Choose Your Wish</div>

      <div class="wishes">

        <button class="wishChoice" data-type="Birthday">
          🎂 Birthday
        </button>

        <button class="wishChoice" data-type="Love Wish">
          ❤️ Love Wish
        </button>

        <button class="wishChoice" data-type="Congratulations">
          🏆 Congratulations
        </button>

        <button class="wishChoice" data-type="Good Luck">
          🍀 Good Luck
        </button>

        <button class="wishChoice" data-type="Good Morning">
          ☀️ Good Morning
        </button>

        <button class="wishChoice" data-type="Good Night">
          🌙 Good Night
        </button>

        <button class="wishChoice" data-type="Sorry">
          🥺 Sorry
        </button>

        <button class="wishChoice" data-type="Anniversary">
          💍 Anniversary
        </button>

        <button class="wishChoice" data-type="Best Wishes">
          ✨ Best Wishes
        </button>

        <button class="wishChoice" data-type="Thank You">
          🙏 Thank You
        </button>

        <button class="wishChoice" data-type="Get Well Soon">
          🌷 Get Well Soon
        </button>

        <button class="wishChoice" data-type="Festival">
          🎊 Festival
        </button>

        <button class="wishChoice" data-type="Custom Wish">
          💫 Custom Wish
        </button>

      </div>

      <div id="form" class="form">

        <label>Your Name</label>

        <input
          id="sender"
          type="text"
          maxlength="60"
          placeholder="Enter your name"
        >

        <label>Recipient Name</label>

        <input
          id="recipient"
          type="text"
          maxlength="60"

        >

        <label>Your Message</label>

        <textarea
          id="message"
          maxlength="1200"
          placeholder="Write your special message..."
        ></textarea>

        <button class="generate" onclick="generateWishLink()">
          🔗 Generate Wish Link
        </button>

      </div>

      <div id="linkBox" class="linkBox">

        <b>✨ Your Wish Link Is Ready!</b>

        <input
          id="generatedLink"
          class="linkInput"
          readonly
        >

        <div class="linkButtons">

          <button class="smallBtn" onclick="copyLink()">
            📋 Copy Link
          </button>

          <button class="smallBtn whatsapp" onclick="shareWhatsApp()">
            💬 Send on WhatsApp
          </button>

        </div>

      </div>

    </div>

    <div class="credit">
      Made by AyushYadavRS ❤️
    </div>

  </div>

</div>


<!-- ================= RECEIVER ================= -->

<div id="receiver" class="receiver">

  <!-- SCREEN 1 -->

  <section id="screen1" class="screen active">

    <div class="glass">

      <div class="bigEmoji">💌</div>

      <h1>Someone Sent You<br>A Special Wish</h1>

      <p>
        A little surprise has been prepared just for you.
      </p>

      <button class="openBtn" onclick="goScreen2()">
        Continue ✨
      </button>

    </div>

  </section>


  <!-- SCREEN 2 -->

  <section id="screen2" class="screen">

    <div class="glass">

      <div class="gift">🎁</div>

      <h1>You Have a Wish!</h1>

      <p>
        Something special is waiting inside.
      </p>

      <button class="openBtn" onclick="goFinal()">
        🎁 Tap to Open
      </button>

    </div>

  </section>


  <!-- SCREEN 3 -->

  <section id="screen3" class="screen">

    <div class="finalCard">

      <div id="typeEmoji" class="typeEmoji">✨</div>

      <div id="cakes" class="special"></div>

      <div id="finalTitle" class="finalTitle"></div>

      <div id="finalMessage" class="finalMessage"></div>

      <div id="finalFrom" class="from"></div>

      <div id="special" class="special"></div>

      <button class="actionBtn" onclick="shareCurrentWish()">
        🔗 Share Wish
      </button>

      <button class="actionBtn restart" onclick="location.href=baseURL()">
        ✨ Create Your Own
      </button>

    </div>

  </section>

</div>


<div id="balloonLayer"></div>

<div id="toast" class="toast"></div>


<script>

/* =====================================================
   WISH CONFIG
===================================================== */

const themes = {

  "Birthday":{
    emoji:"🎂",
    special:"🎈 🎉 🍰 🎉 🎈",
    background:"radial-gradient(circle at top,#ff4f91,#7627c9 55%,#100317)",
    title:"Happy Birthday, NAME! 🎂"
  },

  "Love Wish":{
    emoji:"❤️",
    special:"❤️ 💕 💖 💕 ❤️",
    background:"radial-gradient(circle at top,#ff416c,#8e1748 55%,#18030e)",
    title:"A Special Wish for NAME ❤️"
  },

  "Congratulations":{
    emoji:"🏆",
    special:"🎉 🏆 🥳 🎉 🏆",
    background:"radial-gradient(circle at top,#ffb300,#d84315 55%,#180600)",
    title:"Congratulations, NAME! 🎉"
  },

  "Good Luck":{
    emoji:"🍀",
    special:"🍀 ✨ 🍀 ✨ 🍀",
    background:"radial-gradient(circle at top,#00a884,#176b38 55%,#03140b)",
    title:"Good Luck, NAME! 🍀"
  },

  "Good Morning":{
    emoji:"☀️",
    special:"☀️ 🌤️ ☀️ 🌤️ ☀️",
    background:"radial-gradient(circle at top,#ffb347,#ff7043 55%,#300d00)",
    title:"Good Morning, NAME! ☀️"
  },

  "Good Night":{
    emoji:"🌙",
    special:"🌙 ⭐ ✨ ⭐ 🌙",
    background:"radial-gradient(circle at top,#403078,#182848 55%,#030611)",
    title:"Good Night, NAME! 🌙"
  },

  "Sorry":{
    emoji:"🥺",
    special:"💙 🥺 💙",
    background:"radial-gradient(circle at top,#667eea,#4055a5 55%,#080b25)",
    title:"I'm Sorry, NAME 💙"
  },

  "Anniversary":{
    emoji:"💍",
    special:"💍 ❤️ 💍 ❤️ 💍",
    background:"radial-gradient(circle at top,#d4145a,#702080 55%,#180016)",
    title:"Happy Anniversary, NAME! 💍"
  },

  "Best Wishes":{
    emoji:"✨",
    special:"✨ ⭐ 💫 ⭐ ✨",
    background:"radial-gradient(circle at top,#7f00ff,#4a148c 55%,#100020)",
    title:"Best Wishes, NAME! ✨"
  },

  "Thank You":{
    emoji:"🙏",
    special:"💖 🙏 💖 🙏 💖",
    background:"radial-gradient(circle at top,#00b09b,#096b65 55%,#021b1a)",
    title:"Thank You, NAME! 🙏"
  },

  "Get Well Soon":{
    emoji:"🌷",
    special:"🌷 🌸 🌷 🌸 🌷",
    background:"radial-gradient(circle at top,#56ab2f,#23751c 55%,#041205)",
    title:"Get Well Soon, NAME! 🌷"
  },

  "Festival":{
    emoji:"🎊",
    special:"🎊 🪔 🎉 🪔 🎊",
    background:"radial-gradient(circle at top,#ff8008,#c62828 55%,#1b0600)",
    title:"Happy Festival, NAME! 🎊"
  },

  "Custom Wish":{
    emoji:"💫",
    special:"✨ 💫 ⭐ 💫 ✨",
    background:"radial-gradient(circle at top,#4776e6,#7b1fa2 55%,#0d061b)",
    title:"A Special Wish for NAME 💫"
  }

};


/* =====================================================
   SELECT WISH
===================================================== */

let selectedType = "";

document.querySelectorAll(".wishChoice").forEach(button=>{

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".wishChoice")
      .forEach(item=>item.classList.remove("active"));

    button.classList.add("active");

    selectedType = button.dataset.type;

    document.getElementById("form").style.display="block";

    document.getElementById("form")
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

  });

});


/* =====================================================
   UTF-8 SAFE ENCODE
===================================================== */

function encodeWish(data){

  const json = JSON.stringify(data);

  const bytes = new TextEncoder().encode(json);

  let binary = "";

  bytes.forEach(byte=>{
    binary += String.fromCharCode(byte);
  });

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=/g,"");
}


/* =====================================================
   UTF-8 SAFE DECODE
===================================================== */

function decodeWish(encoded){

  encoded = encoded
    .replace(/-/g,"+")
    .replace(/_/g,"/");

  while(encoded.length % 4){
    encoded += "=";
  }

  const binary = atob(encoded);

  const bytes = Uint8Array.from(
    binary,
    char=>char.charCodeAt(0)
  );

  return JSON.parse(
    new TextDecoder().decode(bytes)
  );

}


/* =====================================================
   BASE WEBSITE URL
===================================================== */

function baseURL(){

  return window.location.origin +
         window.location.pathname;

}


/* =====================================================
   GENERATE REAL SHAREABLE LINK
===================================================== */

function generateWishLink(){

  const sender =
    document.getElementById("sender")
      .value.trim();

  const recipient =
    document.getElementById("recipient")
      .value.trim();

  const message =
    document.getElementById("message")
      .value.trim();

  if(!selectedType){

    showToast("Please choose a wish type.");

    return;
  }

  if(!sender){

    showToast("Please enter your name.");

    return;
  }

  if(!recipient){

    showToast("Please enter the recipient name.");

    return;
  }

  if(!message){

    showToast("Please write your message.");

    return;
  }


  const data = {

    type:selectedType,

    sender:sender,

    recipient:recipient,

    message:message

  };


  const encoded = encodeWish(data);


  /*
     The complete wish is stored inside
     the URL itself.

     Example:

     yoursite.com/?wish=xxxxx
  */

  const link =
    baseURL() +
    "?wish=" +
    encodeURIComponent(encoded);


  document.getElementById("generatedLink")
    .value = link;

  document.getElementById("linkBox")
    .style.display = "block";


  document.getElementById("linkBox")
    .scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

}


/* =====================================================
   COPY LINK
===================================================== */

async function copyLink(){

  const link =
    document.getElementById("generatedLink")
      .value;

  try{

    await navigator.clipboard.writeText(link);

    showToast("Wish link copied! ❤️");

  }catch(error){

    const input =
      document.getElementById("generatedLink");

    input.select();

    document.execCommand("copy");

    showToast("Wish link copied! ❤️");

  }

}


/* =====================================================
   WHATSAPP
===================================================== */

function shareWhatsApp(){

  const link =
    document.getElementById("generatedLink")
      .value;

  const text =
    "💌 I made a special wish for you!\n\n" +
    "Tap this link to open it ✨\n\n" +
    link;

  const whatsappURL =
    "https://wa.me/?text=" +
    encodeURIComponent(text);

  window.open(
    whatsappURL,
    "_blank"
  );

}


/* =====================================================
   READ LINK ON PAGE LOAD
===================================================== */

function checkSharedWish(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const encoded =
    params.get("wish");

  if(!encoded){

    return;

  }


  try{

    const data =
      decodeWish(
        decodeURIComponent(encoded)
      );

    if(
      !data.type ||
      !data.sender ||
      !data.recipient ||
      !data.message
    ){

      throw new Error("Invalid wish");

    }

    openReceiver(data);

  }catch(error){

    console.log(error);

    showToast(
      "This wish link is invalid or damaged."
    );

  }

}


/* =====================================================
   OPEN RECEIVER MODE
===================================================== */

function openReceiver(data){

  window.wishData = data;

  document.getElementById("creator")
    .style.display = "none";

  document.getElementById("receiver")
    .style.display = "block";


  const theme =
    themes[data.type] ||
    themes["Custom Wish"];


  document.getElementById("receiver")
    .style.background =
      theme.background;


  createBalloons();

}


/* =====================================================
   SCREEN 2
===================================================== */

function goScreen2(){

  document.getElementById("screen1")
    .classList.remove("active");

  document.getElementById("screen2")
    .classList.add("active");

  createConfetti();

}


/* =====================================================
   FINAL SCREEN
===================================================== */

function goFinal(){

  const data = window.wishData;

  const theme =
    themes[data.type] ||
    themes["Custom Wish"];


  document.getElementById("screen2")
    .classList.remove("active");

  document.getElementById("screen3")
    .classList.add("active");


  document.getElementById("typeEmoji")
    .textContent =
      theme.emoji;


  document.getElementById("finalTitle")
    .textContent =
      theme.title.replace(
        "NAME",
        data.recipient
      );


  document.getElementById("finalMessage")
    .textContent =
      data.message;


  document.getElementById("finalFrom")
    .textContent =
      "With best wishes from " +
      data.sender +
      " ❤️";


  document.getElementById("special")
    .textContent =
      theme.special;


  if(data.type === "Birthday"){

    document.getElementById("cakes")
      .textContent =
        "🍰 🍰 🍰";

  }else{

    document.getElementById("cakes")
      .textContent = "";

  }


  createConfetti();


  if(
    data.type === "Love Wish" ||
    data.type === "Anniversary"
  ){

    createHearts();

  }


  if(data.type === "Good Night"){

    createStars();

  }

}


/* =====================================================
   BALLOONS
===================================================== */

function createBalloons(){

  const layer =
    document.getElementById("balloonLayer");

  layer.innerHTML = "";


  const colors = [

    "#ff477e",
    "#8e44ff",
    "#00bfff",
    "#ffb300",
    "#00d084",
    "#ff7043"

  ];


  for(let i=0;i<14;i++){

    const balloon =
      document.createElement("div");


    balloon.className = "balloon";


    const color =
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];


    balloon.style.background = color;

    balloon.style.color = color;


    balloon.style.left =
      Math.random()*96 + "%";


    balloon.style.animationDuration =
      (5 + Math.random()*6) + "s";


    balloon.style.animationDelay =
      Math.random()*3 + "s";


    balloon.addEventListener("click",()=>{

      balloon.classList.add("pop");


      createMiniConfetti(
        balloon.getBoundingClientRect().left,
        balloon.getBoundingClientRect().top
      );


      setTimeout(()=>{
        balloon.remove();
      },250);

    });


    layer.appendChild(balloon);

  }

}


/* =====================================================
   MINI CONFETTI
===================================================== */

function createMiniConfetti(x,y){

  for(let i=0;i<14;i++){

    const piece =
      document.createElement("div");


    piece.className = "confetti";


    piece.style.left =
      x + "px";


    piece.style.top =
      y + "px";


    piece.style.animationDuration =
      (.7 + Math.random()*1.3) + "s";


    piece.style.transform =
      "rotate(" +
      Math.random()*360 +
      "deg)";


    document.body.appendChild(piece);


    setTimeout(()=>{
      piece.remove();
    },2200);

  }

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

  for(let i=0;i<90;i++){

      Math.random()*100 + "vw";

    setTimeout(()=>{

}

/* =====================================================
   SHARE CURRENT WISH
===================================================== */

async function shareCurrentWish(){

  const data =
    window.wishData;


  const link =
    baseURL() +
    "?wish=" +
    encodeURIComponent(
      encodeWish(data)
    );


  const text =
    "💌 A special wish for " +
    data.recipient +
    "!\n\n" +
    link;


  if(navigator.share){

    try{

      await navigator.share({

        title:"A Special Wish ❤️",

        text:text,

        url:link

      });

      return;

    }catch(error){}

  }


  try{

    await navigator.clipboard.writeText(link);

    showToast("Wish link copied! ❤️");

  }catch(error){

    showToast("Unable to copy the link.");

  }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

  const toast =
    document.getElementById("toast");


  toast.textContent =
    message;


  toast.classList.add("show");


  setTimeout(()=>{

    toast.classList.remove("show");

  },2300);

}
