<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wish Maker ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#16001f,#45004f,#16001f);
  color:white;
  text-align:center;
  overflow-x:hidden;
}

.container{
  width:92%;
  max-width:650px;
  margin:auto;
  padding:35px 0;
}

h1{
  font-size:42px;
  margin-bottom:10px;
}

.subtitle{
  color:#ffd8f7;
  margin-bottom:30px;
}

.card{
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(12px);
  border-radius:25px;
  padding:25px;
  margin:18px 0;
  box-shadow:0 10px 35px rgba(0,0,0,.3);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

button{
  border:none;
  border-radius:18px;
  padding:17px 10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,#ff4fa3,#8d45ff);
  box-shadow:0 5px 15px rgba(0,0,0,.25);
}

button:active{
  transform:scale(.96);
}

input,textarea{
  width:100%;
  padding:15px;
  margin:9px 0;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:16px;
}

textarea{
  min-height:110px;
  resize:none;
}

.hidden{
  display:none;
}

.wishBox{
  padding:30px 18px;
  border-radius:25px;
  background:linear-gradient(135deg,#ff3f9f,#ff8ac7);
  margin-top:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.wishBox h2{
  font-size:32px;
  margin-bottom:15px;
}

.wishMessage{
  font-size:19px;
  line-height:1.6;
}

.cheesecake{
  font-size:55px;
  margin:20px 0;
  letter-spacing:8px;
}

.photo{
  width:170px;
  height:170px;
  object-fit:cover;
  border-radius:50%;
  border:5px solid white;
  margin:15px auto;
  display:none;
}

.small{
  font-size:14px;
  color:#ffd8f7;
  margin-top:25px;
  padding-bottom:15px;
}

.back{
  background:rgba(255,255,255,.15);
  margin-top:15px;
}

.creator{
  font-weight:bold;
  letter-spacing:.5px;
}
</style>
</head>

<body>

<div class="container">

  <h1>✨ Wish Maker ✨</h1>

  <p class="subtitle">
    Kisi bhi special moment ke liye beautiful wish banao ❤️
  </p>


  <!-- HOME -->
  <div id="home" class="card">

    <h2>💌 Kya Wish Karna Hai?</h2>
    <br>

    <div class="grid">

      <button onclick="selectWish('birthday')">
        🎂 Birthday
      </button>

      <button onclick="selectWish('love')">
        ❤️ Love Wish
      </button>

      <button onclick="selectWish('congrats')">
        🎉 Congratulations
      </button>

      <button onclick="selectWish('goodluck')">
        🌟 Good Luck
      </button>

      <button onclick="selectWish('morning')">
        🌅 Good Morning
      </button>

      <button onclick="selectWish('night')">
        🌙 Good Night
      </button>

      <button onclick="selectWish('sorry')">
        🥺 Sorry
      </button>

      <button onclick="selectWish('anniversary')">
        💖 Anniversary
      </button>

      <button onclick="selectWish('exam')">
        📚 Best Wishes
      </button>

      <button onclick="selectWish('thanks')">
        💐 Thank You
      </button>

      <button onclick="selectWish('getwell')">
        🤗 Get Well Soon
      </button>

      <button onclick="selectWish('festival')">
        🎊 Festival
      </button>

    </div>

    <button onclick="selectWish('custom')" style="margin-top:15px;width:100%;">
      ✨ Custom Wish
    </button>

  </div>


  <!-- CREATE WISH -->
  <div id="creator" class="card hidden">

    <h2 id="wishTitle">✨ Create Your Wish</h2>

    <input
      type="text"
      id="name"
      placeholder="Jiska naam hai ❤️"
    >

    <textarea
      id="message"
      placeholder="Apna special message likho..."
    ></textarea>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      onchange="showPhoto(event)"
    >

    <img id="previewPhoto" class="photo">

    <button onclick="generateWish()" style="width:100%;margin-top:10px;">
      💖 Generate Wish
    </button>

    <button class="back" onclick="goHome()" style="width:100%;">
      ⬅️ Back
    </button>

  </div>


  <!-- RESULT -->
  <div id="result" class="hidden">

    <div class="wishBox">

      <img id="resultPhoto" class="photo">

      <div id="cake" class="cheesecake">
        🍰🍰🍰
      </div>

      <h2 id="resultTitle"></h2>

      <p id="resultMessage" class="wishMessage"></p>

      <br>

      <button onclick="shareWish()">
        📤 Share Wish
      </button>

    </div>

    <button class="back" onclick="goHome()" style="width:100%;">
      ✨ Create Another Wish
    </button>

  </div>


  <!-- CREATOR CREDIT -->
  <p class="small creator">
    Made by AyushYadavRS ❤️
  </p>

</div>


<script>

let selectedWish = "custom";


const wishes = {

birthday:{
title:"🎂 Birthday Wish",
default:"Happy Birthday! 🎉 May your life always be filled with happiness, love and beautiful memories. ❤️"
},

love:{
title:"❤️ Special Love Wish",
default:"You are a very special person in my life. May your bond always stay beautiful and full of happiness. ❤️✨"
},

congrats:{
title:"🎉 Congratulations",
default:"Congratulations! 🎉 You worked hard for this moment. Keep shining and achieving bigger things! 🌟"
},

goodluck:{
title:"🌟 Good Luck",
default:"All the very best! 🌟 Believe in yourself and give your best. You can do it! ❤️"
},

morning:{
title:"🌅 Good Morning",
default:"Good Morning! ☀️ May your day be peaceful, happy and full of beautiful moments. ❤️"
},

night:{
title:"🌙 Good Night",
default:"Good Night! 🌙 Sleep peacefully and wake up with a beautiful smile. Sweet dreams! ❤️"
},

sorry:{
title:"🥺 Sorry",
default:"I'm really sorry. ❤️ I hope you can forgive me and we can make things beautiful again."
},

anniversary:{
title:"💖 Happy Anniversary",
default:"Happy Anniversary! 💖 May your beautiful bond become stronger and happier with every passing day. ✨"
},

exam:{
title:"📚 Best Wishes",
default:"All the very best! 📚 Stay confident, work hard and give your best. You can do it! 🌟"
},

thanks:{
title:"💐 Thank You",
default:"Thank you for always being there. 💐 Your kindness and support mean a lot. ❤️"
},

getwell:{
title:"🤗 Get Well Soon",
default:"Get well soon! 🤗 Take care of yourself and come back with your beautiful smile soon. ❤️"
},

festival:{
title:"🎊 Happy Festival",
default:"Wishing you and your family lots of happiness, peace and beautiful moments. 🎊❤️"
},

custom:{
title:"✨ Special Wish",
default:"Wishing you lots of happiness, success and beautiful memories! ❤️✨"
}

};


function selectWish(type){

  selectedWish = type;

  document.getElementById("home")
  .classList.add("hidden");

  document.getElementById("creator")
  .classList.remove("hidden");

  document.getElementById("wishTitle")
  .innerText = wishes[type].title;

  document.getElementById("message")
  .value = wishes[type].default;

}


function showPhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const img =
    document.getElementById("previewPhoto");

    img.src = e.target.result;

    img.style.display = "block";

  };

  reader.readAsDataURL(file);

}


function generateWish(){

  const name =
  document.getElementById("name")
  .value.trim();

  const message =
  document.getElementById("message")
  .value.trim();

  if(name === ""){

    alert("Pehle naam likho ❤️");

    return;
  }


  document.getElementById("creator")
  .classList.add("hidden");

  document.getElementById("result")
  .classList.remove("hidden");


  document.getElementById("resultTitle")
  .innerText =
  wishes[selectedWish].title +
  " ❤️ " + name;


  document.getElementById("resultMessage")
  .innerText = message;


  const photo =
  document.getElementById("previewPhoto");

  const resultPhoto =
  document.getElementById("resultPhoto");


  if(photo.src){

    resultPhoto.src = photo.src;

    resultPhoto.style.display = "block";

  }


  if(selectedWish === "birthday"){

    document.getElementById("cake")
    .style.display = "block";

  }else{

    document.getElementById("cake")
    .style.display = "none";

  }

}


function goHome(){

  document.getElementById("home")
  .classList.remove("hidden");

  document.getElementById("creator")
  .classList.add("hidden");

  document.getElementById("result")
  .classList.add("hidden");

}


function shareWish(){

  const name =
  document.getElementById("name")
  .value;

  const title =
  wishes[selectedWish].title;

  const message =
  document.getElementById("message")
  .value;


  const text =
  title +
  "\n\nDear " +
  name +
  ", ❤️\n\n" +
  message +
  "\n\n✨ Made by AyushYadavRS";


  if(navigator.share){

    navigator.share({

      title:title,

      text:text

    });

  }else{

    navigator.clipboard
    .writeText(text);

    alert(
      "Wish copy ho gayi ❤️ Ab WhatsApp/Gmail me paste kar do."
    );

  }

}

</script>

</body>
</html>
