<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wish Maker ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  color:white;
  overflow-x:hidden;
  background:linear-gradient(135deg,#667eea,#764ba2);
}

.container{
  width:min(94%,600px);
  margin:auto;
  padding:25px 0 50px;
}

.header{
  text-align:center;
  margin-bottom:22px;
}

.header h1{
  font-size:35px;
  margin-bottom:8px;
  text-shadow:0 5px 18px rgba(0,0,0,.25);
}

.header p{
  opacity:.9;
}

.card{
  background:rgba(255,255,255,.16);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.3);
  border-radius:25px;
  padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

label{
  display:block;
  margin:15px 0 7px;
  font-weight:bold;
}

input,textarea,select{
  width:100%;
  border:0;
  outline:0;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  background:white;
  color:#222;
}

textarea{
  min-height:135px;
  resize:vertical;
}

.mainBtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  margin-top:20px;
  background:white;
  color:#e83e70;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.mainBtn:active{
  transform:scale(.96);
}

.footer{
  text-align:center;
  margin-top:25px;
  font-size:13px;
  opacity:.85;
}

/* receiver */

.screen{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
}

.screen.active{
  display:flex;
}

.receiverBox{
  width:min(95%,600px);
}

.receiverTitle{
  font-size:32px;
  font-weight:bold;
  text-shadow:0 5px 20px rgba(0,0,0,.25);
  margin-bottom:10px;
}

.receiverSub{
  opacity:.9;
  margin-bottom:25px;
}

/* gift */

.giftArea{
  position:relative;
  width:190px;
  height:190px;
  margin:30px auto;
  cursor:pointer;
}

.giftBox{
  position:absolute;
  left:25px;
  bottom:20px;
  width:140px;
  height:100px;
  background:linear-gradient(135deg,#ff3d71,#ff719d);
  border-radius:8px;
}

.giftBox:before{
  content:"";
  position:absolute;
  left:58px;
  width:24px;
  height:100%;
  background:#ffd84d;
}

.giftLid{
  position:absolute;
  left:15px;
  top:48px;
  width:160px;
  height:35px;
  background:#ff527f;
  border-radius:8px;
  z-index:3;
  transition:.8s;
}

.giftLid:before{
  content:"";
  position:absolute;
  left:68px;
  width:24px;
  height:35px;
  background:#ffd84d;
}

.bow{
  position:absolute;
  top:15px;
  left:67px;
  width:55px;
  height:40px;
  z-index:4;
}

.bow:before,
.bow:after{
  content:"";
  position:absolute;
  width:42px;
  height:28px;
  border:9px solid #ffd84d;
  border-radius:50%;
}

.bow:before{
  left:-27px;
  transform:rotate(25deg);
}

.bow:after{
  right:-27px;
  transform:rotate(-25deg);
}

.giftArea.open .giftLid{
  transform:translateY(-90px) rotate(-8deg);
  opacity:0;
}

.tapText{
  font-size:18px;
  font-weight:bold;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.06)}
}

/* wish */

.wishCard{
  background:rgba(255,255,255,.97);
  color:#222;
  border-radius:28px;
  padding:30px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
  animation:appear .8s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.6) translateY(40px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.wishIcon{
  font-size:65px;
  margin-bottom:10px;
  animation:float 2s infinite ease-in-out;
}

@keyframes float{
  50%{
    transform:translateY(-9px);
  }
}

.wishCard h2{
  font-size:29px;
  margin-bottom:12px;
  color:#e83e70;
}

.recipient{
  font-size:23px;
  font-weight:bold;
  margin-bottom:18px;
}

.message{
  font-size:18px;
  line-height:1.7;
  white-space:pre-wrap;
  margin-bottom:22px;
}

.sender{
  color:#666;
  font-size:15px;
  font-weight:bold;
}

.shareBtn{
  border:0;
  border-radius:13px;
  padding:13px 18px;
  margin-top:22px;
  background:#e83e70;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* particles */

.falling{
  position:fixed;
  top:-30px;
  z-index:50;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translate3d(var(--x),110vh,0)
      rotate(var(--r));
    opacity:0;
  }
}

.burst{
  position:fixed;
  z-index:80;
  pointer-events:none;
  font-size:22px;
  animation:burst .9s ease-out forwards;
}

@keyframes burst{
  to{
    transform:
      translate(var(--x),var(--y))
      scale(.3)
      rotate(360deg);
    opacity:0;
  }
}

.flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:.8;
  z-index:100;
  pointer-events:none;
  animation:flash .5s forwards;
}

@keyframes flash{
  to{opacity:0}
}

/* balloons */

.balloon{
  position:fixed;
  bottom:-120px;
  width:48px;
  height:62px;
  border-radius:50%;
  z-index:40;
  cursor:pointer;
  animation:rise linear forwards;
  box-shadow:inset -8px -10px 15px rgba(0,0,0,.15);
}

.balloon:after{
  content:"";
  position:absolute;
  width:1px;
  height:85px;
  background:white;
  left:50%;
  top:61px;
  opacity:.8;
}

@keyframes rise{
  to{
    transform:translateY(-125vh) rotate(12deg);
  }
}

.balloon.pop{
  animation:pop .2s forwards;
}

@keyframes pop{
  50%{transform:scale(1.4)}
  100%{
    transform:scale(0);
    opacity:0;
  }
}

@media(max-width:450px){
  .header h1{font-size:29px}
  .receiverTitle{font-size:27px}
}
</style>
</head>

<body>

<!-- CREATOR -->

<div id="creator" class="container">

  <div class="header">
    <h1>✨ Wish Maker</h1>
    <p>Create a beautiful personalized wish.</p>
  </div>

  <div class="card">

    <label>Wish Type</label>

    <select id="type" onchange="changeTemplate()">

      <option value="Birthday">Birthday</option>
      <option value="Love Wish">Love Wish</option>
      <option value="Congratulations">Congratulations</option>
      <option value="Good Luck">Good Luck</option>
      <option value="Good Morning">Good Morning</option>
      <option value="Good Night">Good Night</option>
      <option value="Sorry">Sorry</option>
      <option value="Anniversary">Anniversary</option>
      <option value="Best Wishes">Best Wishes</option>
      <option value="Thank You">Thank You</option>
      <option value="Get Well Soon">Get Well Soon</option>
      <option value="Festival">Festival</option>
      <option value="Custom Wish">Custom Wish</option>

    </select>


    <label>Your Name</label>

    <input
      id="sender"
      placeholder="Enter your name"
    >


    <label>Recipient Name</label>

    <input
      id="recipient"
      placeholder="Enter recipient name"
    >


    <label>Your Message</label>

    <textarea
      id="message"
      placeholder="Write your message..."
    ></textarea>


    <button
      class="mainBtn"
      onclick="generateLink()"
    >
      🎁 Generate Wish Link
    </button>

  </div>

  <div class="footer">
    Made by AyushYadavRS ❤️
  </div>

</div>


<!-- SCREEN 1 -->

<div id="screen1" class="screen">

  <div class="receiverBox">

    <div class="receiverTitle">
      💌 Someone Sent You A Special Wish
    </div>

    <div class="receiverSub">
      A little surprise is waiting for you...
    </div>

    <button
      class="mainBtn"
      onclick="goGift()"
    >
      Continue ✨
    </button>

  </div>

</div>


<!-- SCREEN 2 -->

<div id="screen2" class="screen">

  <div class="receiverBox">

    <div class="receiverTitle">
      🎁 You Have a Wish!
    </div>

    <div class="receiverSub">
      Tap the gift to reveal it.
    </div>

    <div
      id="gift"
      class="giftArea"
      onclick="openGift()"
    >

      <div class="bow"></div>
      <div class="giftLid"></div>
      <div class="giftBox"></div>

    </div>

    <div class="tapText">
      Tap To Open 🎀
    </div>

  </div>

</div>


<!-- SCREEN 3 -->

<div id="screen3" class="screen">

  <div class="receiverBox">

    <div class="wishCard">

      <div id="icon" class="wishIcon">🎂</div>

      <h2 id="title">
        Happy Birthday!
      </h2>

      <div id="recipientName" class="recipient">
        Dear Friend
      </div>

      <div id="finalMessage" class="message"></div>

      <div id="senderName" class="sender"></div>

      <button
        class="shareBtn"
        onclick="shareWish()"
      >
        🔗 Share This Wish
      </button>

    </div>

  </div>

</div>


<script>

let wishData=null;
let audioCtx=null;


/* READY-MADE MESSAGES */

const templates={

  "Birthday":
  "Wishing you a very Happy Birthday! 🎂🎉 May your day be filled with happiness, laughter, beautiful memories and everything you wish for. Have an amazing year ahead! ❤️",

  "Love Wish":
  "You are truly special, and I hope this little wish brings a beautiful smile to your face. ❤️ May every moment ahead be filled with happiness, warmth and wonderful memories. ✨",

  "Congratulations":
  "Congratulations on your amazing achievement! 🏆🎉 You worked hard for this moment, and you truly deserve it. Keep believing in yourself and keep shining! ✨",

  "Good Luck":
  "Wishing you the very best of luck! 🍀✨ Believe in yourself, stay confident and give it your best. May everything go wonderfully for you! 💚",

  "Good Morning":
  "Good morning! ☀️🌸 May your day begin with a smile, continue with happiness and end with beautiful memories. Have a wonderful day ahead! ✨",

  "Good Night":
  "Good night! 🌙✨ Leave today's worries behind and get some peaceful rest. May tomorrow bring you fresh energy, happiness and beautiful moments. 💙",

  "Sorry":
  "I'm truly sorry. 💙 I hope you can forgive me and let this little message bring a smile back to your face. Some things are difficult to say, but I genuinely mean it. 🌸",

  "Anniversary":
  "Happy Anniversary! 💍❤️ Wishing you many more beautiful moments, unforgettable memories and happiness together. May every year bring something even more special. ✨",

  "Best Wishes":
  "Sending you my very best wishes! ✨ May life bring you happiness, success, peace and countless beautiful moments. Keep smiling and keep shining! 🌟",

  "Thank You":
  "Thank you so much! 💖 Your kindness and support mean more than words can say. I'm truly grateful and hope you always know how appreciated you are. ✨",

  "Get Well Soon":
  "Sending you warm wishes for a quick recovery! 🌸💐 Take good care of yourself, get plenty of rest and come back stronger with a big smile. 💙",

  "Festival":
  "Wishing you a joyful and beautiful festival! 🎊✨ May your celebrations be filled with happiness, laughter, peace and wonderful memories with your loved ones. ❤️",

  "Custom Wish":
  "Wishing you happiness, success, peace and countless beautiful moments. ✨ May every new day bring something wonderful into your life. ❤️"

};


/* THEME DATA */

const themes={

  "Birthday":{
    icon:"🎂",
    title:"Happy Birthday! 🎉",
    bg:"linear-gradient(135deg,#ff758c,#ff7eb3,#8e9eff)",
    particles:["🎈","🎉","🎂","⭐","✨"]
  },

  "Love Wish":{
    icon:"❤️",
    title:"A Special Wish For You ❤️",
    bg:"linear-gradient(135deg,#ff416c,#ff4b2b)",
    particles:["❤️","💖","💕","💗","💘"]
  },

  "Congratulations":{
    icon:"🏆",
    title:"Congratulations! 🎉",
    bg:"linear-gradient(135deg,#11998e,#38ef7d)",
    particles:["🏆","🎉","⭐","✨","🥳"]
  },

  "Good Luck":{
    icon:"🍀",
    title:"Good Luck! ✨",
    bg:"linear-gradient(135deg,#56ab2f,#a8e063)",
    particles:["🍀","🌿","✨","⭐","💚"]
  },

  "Good Morning":{
    icon:"☀️",
    title:"Good Morning! 🌅",
    bg:"linear-gradient(135deg,#f7971e,#ffd200)",
    particles:["☀️","🌞","✨","🌸","🌼"]
  },

  "Good Night":{
    icon:"🌙",
    title:"Good Night! ✨",
    bg:"linear-gradient(135deg,#141e30,#243b55)",
    particles:["🌙","⭐","✨","💫","🌟"]
  },

  "Sorry":{
    icon:"💙",
    title:"I'm Sorry 💙",
    bg:"linear-gradient(135deg,#4facfe,#00f2fe)",
    particles:["💙","🩵","🌧️","🌸","✨"]
  },

  "Anniversary":{
    icon:"💍",
    title:"Happy Anniversary! ❤️",
    bg:"linear-gradient(135deg,#ee0979,#ff6a00)",
    particles:["💍","❤️","💕","🌹","✨"]
  },

  "Best Wishes":{
    icon:"✨",
    title:"Best Wishes! 🌟",
    bg:"linear-gradient(135deg,#8e2de2,#4a00e0)",
    particles:["✨","⭐","🌟","💫","🔮"]
  },

  "Thank You":{
    icon:"🙏",
    title:"Thank You! 💖",
    bg:"linear-gradient(135deg,#fc5c7d,#6a82fb)",
    particles:["💖","🌸","✨","🙏","💕"]
  },

  "Get Well Soon":{
    icon:"🌸",
    title:"Get Well Soon! 💐",
    bg:"linear-gradient(135deg,#43cea2,#185a9d)",
    particles:["🌸","🌷","🌼","💐","💙"]
  },

  "Festival":{
    icon:"🎊",
    title:"Happy Festival! 🎉",
    bg:"linear-gradient(135deg,#f12711,#f5af19)",
    particles:["🎊","🎉","✨","🌟","🎈"]
  },

  "Custom Wish":{
    icon:"✨",
    title:"A Special Wish For You ✨",
    bg:"linear-gradient(135deg,#667eea,#764ba2)",
    particles:["✨","⭐","💫","🌟","💖"]
  }

};


/* CHANGE MESSAGE AUTOMATICALLY */

function changeTemplate(){

  const type=
    document.getElementById("type").value;

  document.getElementById("message").value=
    templates[type];

}


/* INITIAL MESSAGE */

changeTemplate();


/* AUDIO */

function getAudio(){

  const AudioContext=
    window.AudioContext ||
    window.webkitAudioContext;

  if(!AudioContext)return null;

  if(!audioCtx){
    audioCtx=new AudioContext();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

  return audioCtx;
}


function popSound(){

  const ctx=getAudio();

  if(!ctx)return;

  const now=ctx.currentTime;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.type="triangle";

  osc.frequency.setValueAtTime(220,now);

  osc.frequency.exponentialRampToValueAtTime(
    55,
    now+.15
  );

  gain.gain.setValueAtTime(.001,now);

  gain.gain.exponentialRampToValueAtTime(
    .45,
    now+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.17
  );

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.start(now);
  osc.stop(now+.18);

}


/* ENCODE */

function encode(data){

  const json=JSON.stringify(data);

  const bytes=new TextEncoder().encode(json);

  let binary="";

  bytes.forEach(b=>{
    binary+=String.fromCharCode(b);
  });

  return btoa(binary)
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=/g,"");
}


/* DECODE */

function decode(str){

  str=str
    .replace(/-/g,"+")
    .replace(/_/g,"/");

  while(str.length%4)
    str+="=";

  const binary=atob(str);

  const bytes=Uint8Array.from(
    binary,
    c=>c.charCodeAt(0)
  );

  return JSON.parse(
    new TextDecoder().decode(bytes)
  );

}


/* CREATE LINK */

function generateLink(){

  const sender=
    document.getElementById("sender").value.trim();

  const recipient=
    document.getElementById("recipient").value.trim();

  const message=
    document.getElementById("message").value.trim();

  const type=
    document.getElementById("type").value;


  if(!sender||!recipient||!message){

    alert("Please fill in all fields.");

    return;

  }


  wishData={
    sender,
    recipient,
    message,
    type
  };


  const encoded=encode(wishData);

  const link=
    location.origin+
    location.pathname+
    "?wish="+
    encodeURIComponent(encoded);


  navigator.clipboard
    .writeText(link)
    .catch(()=>{});


  if(navigator.share){

    navigator.share({
      title:"A Special Wish For You 💌",
      text:"You received a special wish! 🎁",
      url:link
    }).catch(()=>{});

  }else{

    alert(
      "Wish link copied! 🔗\n\nSend it to your friend."
    );

  }

}


/* CHECK LINK */

function checkLink(){

  const params=
    new URLSearchParams(location.search);

  const encoded=
    params.get("wish");

  if(!encoded)return;

  try{

    wishData=decode(encoded);

    document.getElementById("creator")
      .style.display="none";

    document.getElementById("screen1")
      .classList.add("active");

  }catch(e){

    alert("Invalid wish link.");

  }

}


/* SCREEN 1 */

function goGift(){

  getAudio();

  document.getElementById("screen1")
    .classList.remove("active");

  document.getElementById("screen2")
    .classList.add("active");

  createCategoryEffects(
    wishData.type,
    18
  );

}


/* OPEN GIFT */

function openGift(){

  getAudio();

  document.getElementById("gift")
    .classList.add("open");

  popSound();

  flash();

  createCategoryEffects(
    wishData.type,
    70
  );


  setTimeout(()=>{

    document.getElementById("screen2")
      .classList.remove("active");

    document.getElementById("screen3")
      .classList.add("active");

    showWish();

  },700);

}


/* SHOW FINAL WISH */

function showWish(){

  const theme=
    themes[wishData.type] ||
    themes["Custom Wish"];


  document.body.style.background=
    theme.bg;


  document.getElementById("icon")
    .textContent=theme.icon;


  document.getElementById("title")
    .textContent=theme.title;


  document.getElementById("recipientName")
    .textContent=
      "Dear "+wishData.recipient;


  document.getElementById("finalMessage")
    .textContent=
      wishData.message;


  document.getElementById("senderName")
    .textContent=
      "With best wishes from "+
      wishData.sender+
      " ❤️";


  createCategoryEffects(
    wishData.type,
    90
  );

}


/* CATEGORY EFFECTS */

function createCategoryEffects(type,amount){

  const theme=
    themes[type] ||
    themes["Custom Wish"];


  for(let i=0;i<amount;i++){

    const item=
      document.createElement("div");

    item.className="falling";

    const particle=
      theme.particles[
        Math.floor(
          Math.random()*
          theme.particles.length
        )
      ];


    item.textContent=particle;


    item.style.left=
      Math.random()*100+"vw";


    item.style.fontSize=
      (15+Math.random()*20)+"px";


    item.style.setProperty(
      "--x",
      (Math.random()*400-200)+"px"
    );


    item.style.setProperty(
      "--r",
      (Math.random()*900-450)+"deg"
    );


    item.style.animationDuration=
      (2.2+Math.random()*3)+"s";


    item.style.animationDelay=
      Math.random()*1+"s";


    document.body.appendChild(item);


    setTimeout(()=>{
      item.remove();
    },6000);

  }


  /* Birthday gets balloons */
  if(type==="Birthday"){
    createBalloons();
  }

}


/* BALLOONS ONLY FOR BIRTHDAY */

function createBalloons(){

  const colors=[
    "#ff4d6d",
    "#ff9f1c",
    "#ffd166",
    "#06d6a0",
    "#118ab2",
    "#8338ec",
    "#ff70a6"
  ];


  for(let i=0;i<12;i++){

    const b=
      document.createElement("div");

    b.className="balloon";

    const color=
      colors[
        Math.floor(
          Math.random()*colors.length
        )
      ];


    b.style.background=color;

    b.style.left=
      Math.random()*95+"vw";


    b.style.animationDuration=
      (5+Math.random()*5)+"s";


    b.style.animationDelay=
      Math.random()*2+"s";


    b.onclick=function(e){

      if(b.classList.contains("pop"))
        return;


      popSound();

      b.classList.add("pop");

      createBurst(
        e.clientX,
        e.clientY,
        "🎉"
      );

      createCategoryEffects(
        "Birthday",
        20
      );

    };


    document.body.appendChild(b);


    setTimeout(()=>{
      b.remove();
    },11000);

  }

}


/* BURST */

function createBurst(x,y,type){

  for(let i=0;i<22;i++){

    const p=
      document.createElement("div");

    p.className="burst";

    p.textContent=type;

    p.style.left=x+"px";
    p.style.top=y+"px";


    const angle=
      Math.random()*Math.PI*2;

    const distance=
      40+Math.random()*120;


    p.style.setProperty(
      "--x",
      Math.cos(angle)*distance+"px"
    );

    p.style.setProperty(
      "--y",
      Math.sin(angle)*distance+"px"
    );


    document.body.appendChild(p);


    setTimeout(()=>{
      p.remove();
    },1000);

  }

}


/* FLASH */

function flash(){

  const f=
    document.createElement("div");

  f.className="flash";

  document.body.appendChild(f);

  setTimeout(()=>{
    f.remove();
  },500);

}


/* SHARE */

function shareWish(){

  const encoded=
    encode(wishData);

  const link=
    location.origin+
    location.pathname+
    "?wish="+
    encodeURIComponent(encoded);


  if(navigator.share){

    navigator.share({

      title:
        "A Special Wish For "+
        wishData.recipient,

      text:
        "You received a special wish! 🎁",

      url:link

    }).catch(()=>{});

  }else{

    navigator.clipboard
      .writeText(link)
      .then(()=>{
        alert("Wish link copied! 🔗");
      });

  }

}
