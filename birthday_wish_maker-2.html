<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Wish Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b22;color:#fff;min-height:100vh}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(560px,100%);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:28px;padding:28px;box-shadow:0 20px 70px #0008;backdrop-filter:blur(12px)}
h1{font-size:34px;text-align:center;margin:5px 0 8px}.sub{text-align:center;color:#c9c9df;margin-bottom:24px}
label{display:block;margin:15px 0 7px;color:#eee}input,textarea{width:100%;padding:14px 15px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff10;color:#fff;font-size:16px;outline:none}textarea{min-height:95px;resize:vertical}
button{width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(90deg,#ff4f9a,#8d6bff);color:#fff;font-size:17px;font-weight:bold;margin-top:18px;cursor:pointer}.small{font-size:12px;color:#aaa;text-align:center;margin-top:16px}
.hidden{display:none}.wish{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#49236d,#100b2d 55%,#050616);text-align:center;padding:40px 20px}
h2{font-size:48px;margin:70px 0 12px;text-shadow:0 0 25px #ff65bd}.from{color:#ddd;font-size:18px}.message{max-width:650px;margin:30px auto;padding:22px;border-radius:22px;background:#ffffff12;font-size:20px;line-height:1.6}
.cake{font-size:90px;margin-top:20px;animation:bounce 1.4s infinite alternate}.open{max-width:300px;margin:22px auto}.footer{position:absolute;bottom:15px;width:100%;left:0;color:#aaa;font-size:12px}
.balloon{position:absolute;width:48px;height:62px;border-radius:50%;background:#ff4f9a;bottom:-100px;animation:up linear infinite;opacity:.9}.balloon:after{content:"";position:absolute;width:1px;height:60px;background:#fff8;top:60px;left:24px}.b1{left:8%;animation-duration:8s}.b2{left:23%;animation-duration:11s;background:#ffd34f}.b3{left:48%;animation-duration:9s;background:#75d8ff}.b4{left:72%;animation-duration:12s;background:#9d78ff}.b5{left:88%;animation-duration:10s;background:#ff78b7}
.pop{position:fixed;inset:0;pointer-events:none}.pop i{position:absolute;width:9px;height:18px;background:#fff;animation:confetti 1.8s forwards}
@keyframes up{to{transform:translateY(-120vh) rotate(25deg)}}@keyframes bounce{to{transform:translateY(-12px)}}@keyframes confetti{to{transform:translate(var(--x),100vh) rotate(700deg);opacity:0}}
a{color:#9fd5ff}
</style>
</head>
<body>
<div id="maker" class="page">
  <div class="card">
    <h1>🎂 Birthday Wish Maker</h1>
    <div class="sub">Create a beautiful birthday surprise and share one simple link.</div>
    <label>Birthday person's name</label>
    <input id="name" placeholder="e.g. Priya">
    <label>Your name</label>
    <input id="from" placeholder="e.g. Rahul">
    <label>Birthday message</label>
    <textarea id="msg" placeholder="Write your special birthday message..."></textarea>
    <button onclick="createWish()">✨ Create Birthday Link</button>
    <div id="result" class="small"></div>
    <div class="small">Created by AyushYadavRS</div>
  </div>
</div>

<div id="wish" class="wish hidden">
  <div class="balloon b1"></div><div class="balloon b2"></div><div class="balloon b3"></div><div class="balloon b4"></div><div class="balloon b5"></div>
  <div class="pop" id="pop"></div>
  <div class="cake">🎂</div>
  <h2 id="wname">Happy Birthday!</h2>
  <div class="from" id="wfrom"></div>
  <div class="message" id="wmsg"></div>
  <button class="open" onclick="surprise()">🎁 Tap for Surprise</button>
  <div class="footer">Created by AyushYadavRS</div>
</div>

<script>
function enc(v){return encodeURIComponent(v||"")}
function createWish(){
 const n=document.getElementById("name").value.trim();
 const f=document.getElementById("from").value.trim();
 const m=document.getElementById("msg").value.trim();
 if(!n){alert("Birthday person's name enter karo ❤️");return}
 const base=location.href.split("?")[0];
 const url=base+"?name="+enc(n)+"&from="+enc(f)+"&msg="+enc(m);
 document.getElementById("result").innerHTML='Link ready! <br><a href="'+url+'">'+url+'</a><br><br>Is link ko copy karke share kar sakte ho.';
 navigator.clipboard?.writeText(url).catch(()=>{});
}
function showWish(){
 const p=new URLSearchParams(location.search);
 if(!p.get("name"))return;
 document.getElementById("maker").classList.add("hidden");
 document.getElementById("wish").classList.remove("hidden");
 document.getElementById("wname").textContent="Happy Birthday "+p.get("name")+"! 🎉";
 document.getElementById("wfrom").textContent=p.get("from")?"With lots of wishes from "+p.get("from")+" ❤️":"Lots of birthday wishes! ❤️";
 document.getElementById("wmsg").textContent=p.get("msg")||"May your day be filled with happiness, smiles and beautiful memories! ✨";
 setTimeout(confetti,300);
}
function confetti(){
 const box=document.getElementById("pop");
 for(let i=0;i<45;i++){
  const x=document.createElement("i");x.style.left=Math.random()*100+"%";x.style.top="-20px";
  x.style.setProperty("--x",(Math.random()*220-110)+"px");x.style.background=["#ff6bb5","#ffd34f","#6ee7ff","#a98bff","#fff"][i%5];
  box.appendChild(x);
 }
}
function surprise(){confetti();alert("🎁 Surprise! You are very special. Have the happiest birthday! ❤️")}
showWish();
</script>
</body>
</html>
